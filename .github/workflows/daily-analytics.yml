name: Shidatube 日次分析データ取得

on:
  schedule:
    - cron: "0 0 * * *"  # 毎日 09:00 JST（UTC 00:00）に実行
  workflow_dispatch: {}   # 手動実行ボタン用（テストや任意タイミングでの実行）

permissions:
  contents: write  # 取得したデータをリポジトリにコミットするために必要

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        run: pip install -r analytics/requirements.txt

      - name: データ取得（Data API / Analytics API / Reporting API）
        working-directory: analytics
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SHIDATUBE_CHANNEL_ID: ${{ secrets.SHIDATUBE_CHANNEL_ID }}
        run: python collect_snapshot.py

      - name: 取得データをコミット
        run: |
          git config user.name "shidatube-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add analytics/data
          git diff --cached --quiet || git commit -m "chore: 日次データ取得 $(date -u +%Y-%m-%d)"
          git push
